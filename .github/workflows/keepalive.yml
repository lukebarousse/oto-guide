# Supabase free-tier projects pause after ~1 week without traffic.
# This pings the REST endpoint twice a week so the database stays awake.
name: keep supabase awake
on:
  schedule:
    - cron: "17 12 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          # reads the public config committed in js/config.js
          curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/js/config.js -o cfg.js
          URL=$(grep -o 'url: *"[^"]*"' cfg.js | cut -d'"' -f2)
          KEY=$(grep -o 'anonKey: *"[^"]*"' cfg.js | cut -d'"' -f2)
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            curl -s -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/seasons?select=year" -H "apikey: $KEY"
          else
            echo "config empty — skipping"
          fi
